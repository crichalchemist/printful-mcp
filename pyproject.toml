[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printful-mcp"
version = "0.1.0"
description = "MCP server for Printful API — browse products, create orders, generate mockups from AI assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Purple Horizons"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "printful",
    "print-on-demand",
    "ai",
    "llm",
    "claude",
    "ecommerce"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bound is required, not cautious: mcp 2.x renamed FastMCP to
    # MCPServer, so server.py fails at import against 2.x. Without this pin a
    # fresh `pip install -e .` produces a server that cannot start.
    "mcp>=0.9.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # cli-anything-printful (src/cli_anything/printful)
    "click>=8.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Purple-Horizons/printful-mcp"
Repository = "https://github.com/Purple-Horizons/printful-mcp"
Issues = "https://github.com/Purple-Horizons/printful-mcp/issues"

[tool.pytest.ini_options]
# The root-level test_*.py files are standalone scripts (run them directly with
# `python test_server.py`), not pytest modules: they define module-level
# `async def test_*` with no asyncio mode, so pytest collects them and then
# fails all 14. Scoping collection to the real suite keeps `pytest` meaningful.
testpaths = ["src/printful_core/tests", "src/cli_anything/printful/tests", "tests"]
# Live tests call the real Printful API and need PRINTFUL_API_KEY, so they are
# not in the default selection — a fresh clone runs the offline suite and gets
# a clean result. They are NOT softened: when selected without credentials they
# fail loudly rather than skip.
#   pytest              -> offline unit suite
#   pytest -m live      -> live API suite (requires PRINTFUL_API_KEY)
#   pytest -m ""        -> everything
addopts = "-m 'not live'"
markers = [
    "live: hits the real Printful API; requires PRINTFUL_API_KEY",
]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
# cli_anything/ is a PEP 420 namespace package shared across cli-anything
# harnesses and deliberately has no __init__.py, so namespace discovery must
# stay enabled.
namespaces = true

[tool.setuptools.package-data]
"cli_anything.printful" = ["skills/*.md"]

[project.scripts]
printful-mcp = "printful_mcp.server:main"
cli-anything-printful = "cli_anything.printful.printful_cli:main"
