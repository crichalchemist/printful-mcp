[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printful-mcp"
version = "0.1.0"
description = "MCP server for Printful API — browse products, create orders, generate mockups from AI assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Purple Horizons"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "printful",
    "print-on-demand",
    "ai",
    "llm",
    "claude",
    "ecommerce"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bound is required, not cautious: mcp 2.x renamed FastMCP to
    # MCPServer, so server.py fails at import against 2.x. Without this pin a
    # fresh `pip install -e .` produces a server that cannot start.
    "mcp>=0.9.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # printful_cli (src/printful_cli)
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Purple-Horizons/printful-mcp"
Repository = "https://github.com/Purple-Horizons/printful-mcp"
Issues = "https://github.com/Purple-Horizons/printful-mcp/issues"

[tool.pytest.ini_options]
# The three root-level test_*.py files are dead. They import `printful_mcp.client`,
# which no longer exists, so pytest fails at collection with ModuleNotFoundError
# before running a single case -- `asyncio_mode` below is set and is not the cause.
# Scoping collection to the real suite keeps `pytest` meaningful. They are
# superseded by the suites under src/*/tests/ and are pending deletion.
testpaths = ["src/printful_core/tests", "src/printful_cli/tests", "src/printful_mcp/tests", "tests"]
# Live tests call the real Printful API and need PRINTFUL_API_KEY, so they are
# not in the default selection — a fresh clone runs the offline suite and gets
# a clean result. They are NOT softened: when selected without credentials they
# fail loudly rather than skip.
#   pytest              -> offline unit suite
#   pytest -m live      -> live API suite (requires PRINTFUL_API_KEY and,
#                          for an account-level token, PRINTFUL_STORE_ID --
#                          without the store ID, store-scoped endpoints fail
#                          with "This endpoint requires 'store_id'!")
#   pytest -m ""        -> everything
addopts = "-m 'not live'"
markers = [
    "live: hits the real Printful API; requires PRINTFUL_API_KEY",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "DTZ", "C4", "PIE", "ISC", "BLE", "RUF"]
# F541 flags `f""`. Sixty-seven of the seventy-five are markdown.py's blank-line
# idiom inside lists of f-strings, where the prefix keeps a column aligned. The
# rule is correct and the code is deliberate, so the rule is off rather than the
# code changed.
ignore = ["F541"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"printful_cli" = ["skills/*.md"]

[project.scripts]
printful-mcp = "printful_mcp.server:main"
printful = "printful_cli.printful_cli:main"
